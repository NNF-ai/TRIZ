                <div style={{ fontSize: 10, color: "#6B7280" }}>퀴즈 풀기</div>
              </div>
              <div style={{ textAlign: "center", flex: 1, background: "rgba(69,183,209,0.1)", borderRadius: 12, padding: "10px 8px" }}>
                <div style={{ fontSize: 20, fontWeight: 800, color: "#45B7D1" }}>{totalQuizzes > 0 ? Math.round(correctCount / totalQuizzes * 100) : 0}%</div>
                <div style={{ fontSize: 10, color: "#6B7280" }}>정답률</div>
              </div>
            </div>
          </div>

          <div style={{ background: "rgba(255,255,255,0.05)", borderRadius: 12, padding: 16, marginBottom: 20 }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
              <span style={{ fontSize: 13, fontWeight: 600 }}>전체 학습 진행도</span>
              <span style={{ fontSize: 13, color: "#FF6B35", fontWeight: 700 }}>{Math.round(learned.length / 40 * 100)}%</span>
            </div>
            <div style={{ background: "rgba(255,255,255,0.08)", borderRadius: 6, height: 8, overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${learned.length / 40 * 100}%`, background: "linear-gradient(90deg, #FF6B35, #FF8C5E)", borderRadius: 6, transition: "width 0.5s ease" }} />
            </div>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 20 }}>
            {[
              { icon: "📚", label: "원리 학습", sub: "40가지 발명원리", action: () => setView("list"), color: "#FF6B35" },
              { icon: "🧩", label: "퀴즈 풀기", sub: `연속 정답: ${streak}회`, action: startQuiz, color: "#4ECDC4" },
              { icon: "📊", label: "학습 현황", sub: `${learned.length}개 완료`, action: () => setView("stats"), color: "#45B7D1" },
              { icon: "🎲", label: "랜덤 학습", sub: "무작위 원리", action: () => { const r = TRIZ_PRINCIPLES[Math.floor(Math.random()*40)]; setSelected(r); setView("detail"); }, color: "#DDA0DD" },
            ].map((item, i) => (
              <button key={i} onClick={item.action} style={{ background: "linear-gradient(135deg, #1A2035, #0F1923)", border: `1px solid ${item.color}30`, borderRadius: 16, padding: "16px 14px", cursor: "pointer", textAlign: "left" }}>
                <div style={{ fontSize: 28, marginBottom: 6 }}>{item.icon}</div>
                <div style={{ fontSize: 14, fontWeight: 700, color: "#E8EAF0" }}>{item.label}</div>
                <div style={{ fontSize: 11, color: "#6B7280", marginTop: 2 }}>{item.sub}</div>
              </button>
            ))}
          </div>

          <div style={{ marginBottom: 8 }}>
            <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 12 }}>카테고리별 탐색</div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
              {Object.entries(categoryColors).map(([cat, color]) => {
                const count = TRIZ_PRINCIPLES.filter(p => p.category === cat).length;
                const doneCount = TRIZ_PRINCIPLES.filter(p => p.category === cat && learned.includes(p.id)).length;
                return (
                  <button key={cat} onClick={() => { setCategory(cat); setView("list"); }} style={{ background: `${color}18`, border: `1px solid ${color}40`, borderRadius: 20, padding: "6px 14px", cursor: "pointer", color: color, fontSize: 12, fontWeight: 600 }}>
                    {cat} {doneCount}/{count}
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      )}

      {/* LIST */}
      {view === "list" && (
        <div style={{ padding: "16px" }}>
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="원리 이름, 키워드 검색..." style={{ width: "100%", boxSizing: "border-box", background: "rgba(255,255,255,0.06)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 12, padding: "12px 16px", color: "#E8EAF0", fontSize: 14, marginBottom: 12, outline: "none" }} />
          <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 8, marginBottom: 16 }}>
            {CATEGORIES.map(cat => (
              <button key={cat} onClick={() => setCategory(cat)} style={{ whiteSpace: "nowrap", background: category === cat ? "#FF6B35" : "rgba(255,255,255,0.06)", border: "none", borderRadius: 20, padding: "7px 14px", cursor: "pointer", color: category === cat ? "#fff" : "#9CA3AF", fontSize: 12, fontWeight: category === cat ? 700 : 400 }}>{cat}</button>
            ))}
          </div>
          <div style={{ fontSize: 12, color: "#6B7280", marginBottom: 12 }}>{filtered.length}개 원리</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10, paddingBottom: 80 }}>
            {filtered.map(p => (
              <button key={p.id} onClick={() => { setSelected(p); setView("detail"); }} style={{ background: learned.includes(p.id) ? `linear-gradient(135deg, ${p.color}20, ${p.color}08)` : "rgba(255,255,255,0.04)", border: `1px solid ${learned.includes(p.id) ? p.color + "50" : "rgba(255,255,255,0.08)"}`, borderRadius: 16, padding: "14px 16px", cursor: "pointer", textAlign: "left", display: "flex", alignItems: "center", gap: 14 }}>
                <div style={{ width: 44, height: 44, borderRadius: 12, background: `${p.color}20`, border: `1px solid ${p.color}40`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, flexShrink: 0 }}>{p.icon}</div>
                <div style={{ flex: 1 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 2 }}>
                    <span style={{ fontSize: 11, color: p.color, fontWeight: 700 }}>#{p.id}</span>
                    <span style={{ fontSize: 15, fontWeight: 700, color: "#E8EAF0" }}>{p.name}</span>
                    {learned.includes(p.id) && <span style={{ fontSize: 10, color: p.color }}>✓</span>}
                  </div>
                  <div style={{ fontSize: 12, color: "#6B7280" }}>{p.en}</div>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 4, marginTop: 6 }}>
                    {p.keywords.slice(0, 3).map(k => (<span key={k} style={{ fontSize: 10, color: p.color, background: `${p.color}15`, borderRadius: 6, padding: "2px 6px" }}>{k}</span>))}
                  </div>
                </div>
                <span style={{ color: "#6B7280", fontSize: 16 }}>›</span>
              </button>
            ))}
          </div>
        </div>
      )}

      {/* DETAIL */}
      {view === "detail" && selected && (
        <div style={{ padding: "20px 16px", paddingBottom: 100 }}>
          <div style={{ background: `linear-gradient(135deg, ${selected.color}25, ${selected.color}08)`, border: `1px solid ${selected.color}40`, borderRadius: 20, padding: 24, marginBottom: 16, textAlign: "center" }}>
            <div style={{ fontSize: 52, marginBottom: 12 }}>{selected.icon}</div>
            <div style={{ fontSize: 11, color: selected.color, letterSpacing: 2, textTransform: "uppercase", marginBottom: 6, fontWeight: 700 }}>원리 #{selected.id} · {selected.category}</div>
            <div style={{ fontSize: 26, fontWeight: 800, marginBottom: 4 }}>{selected.name}</div>
            <div style={{ fontSize: 14, color: "#6B7280" }}>{selected.en}</div>
          </div>

          <div style={{ background: "rgba(255,255,255,0.04)", borderRadius: 16, padding: 18, marginBottom: 14 }}>
            <div style={{ fontSize: 11, color: "#6B7280", marginBottom: 8, textTransform: "uppercase", letterSpacing: 1 }}>설명</div>
            <div style={{ fontSize: 14, lineHeight: 1.8, color: "#D1D5DB" }}>{selected.description}</div>
          </div>

          <div style={{ marginBottom: 14 }}>
            <div style={{ fontSize: 11, color: "#6B7280", marginBottom: 8, textTransform: "uppercase", letterSpacing: 1 }}>핵심 키워드</div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
              {selected.keywords.map(k => (<span key={k} style={{ background: `${selected.color}20`, border: `1px solid ${selected.color}40`, color: selected.color, borderRadius: 20, padding: "6px 14px", fontSize: 13, fontWeight: 600 }}>{k}</span>))}
            </div>
          </div>

          <div style={{ background: "rgba(255,255,255,0.04)", borderRadius: 16, padding: 18, marginBottom: 16 }}>
            <div style={{ fontSize: 11, color: "#6B7280", marginBottom: 12, textTransform: "uppercase", letterSpacing: 1 }}>적용 사례</div>
            {selected.examples.map((ex, i) => (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 0", borderBottom: i < selected.examples.length - 1 ? "1px solid rgba(255,255,255,0.06)" : "none" }}>
                <div style={{ width: 28, height: 28, background: `${selected.color}20`, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, color: selected.color, fontWeight: 700, flexShrink: 0 }}>{i+1}</div>
                <span style={{ fontSize: 14, color: "#D1D5DB" }}>{ex}</span>
              </div>
            ))}
          </div>

          <div style={{ background: "rgba(255,255,255,0.04)", borderRadius: 16, padding: 18, marginBottom: 16 }}>
            <div style={{ fontSize: 11, color: "#6B7280", marginBottom: 10, textTransform: "uppercase", letterSpacing: 1 }}>미니 퀴즈</div>
            <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 14, lineHeight: 1.6 }}>{selected.quiz.question}</div>
            {selected.quiz.options.map((opt, i) => {
              const isAnswered = quizState.answered !== null;
              const isSelected = quizState.answered === i;
              const isCorrect = i === selected.quiz.answer;
              let bg = "rgba(255,255,255,0.05)", border = "rgba(255,255,255,0.1)";
              if (isAnswered) { if (isCorrect) { bg = "rgba(78,205,196,0.15)"; border = "#4ECDC4"; } else if (isSelected) { bg = "rgba(255,80,80,0.15)"; border = "#FF5050"; } }
              return (<button key={i} onClick={() => !isAnswered && handleQuizAnswer(i)} style={{ display: "block", width: "100%", background: bg, border: `1px solid ${border}`, borderRadius: 12, padding: "12px 14px", marginBottom: 8, cursor: isAnswered ? "default" : "pointer", color: "#E8EAF0", fontSize: 13, textAlign: "left" }}>
                <span style={{ color: "#6B7280", marginRight: 8 }}>{["A","B","C","D"][i]}.</span>{opt}
                {isAnswered && isCorrect && " ✓"}{isAnswered && isSelected && !isCorrect && " ✗"}
              </button>);
            })}
            {quizState.answered !== null && (
              <div style={{ marginTop: 8, padding: 12, borderRadius: 10, background: quizState.correct ? "rgba(78,205,196,0.1)" : "rgba(255,80,80,0.1)", color: quizState.correct ? "#4ECDC4" : "#FF6B6B", fontSize: 13, fontWeight: 600 }}>
                {quizState.correct ? "🎉 정답입니다!" : "❌ 틀렸습니다. 다시 시도해보세요."}
              </div>
            )}
          </div>

          <div style={{ display: "flex", gap: 10, marginBottom: 16 }}>
            {selected.id > 1 && (<button onClick={() => { setSelected(TRIZ_PRINCIPLES[selected.id-2]); setQuizState({answered:null,correct:false}); }} style={{ flex: 1, background: "rgba(255,255,255,0.06)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 12, padding: "12px", color: "#9CA3AF", cursor: "pointer", fontSize: 13 }}>← 이전 원리</button>)}
            {selected.id < 40 && (<button onClick={() => { setSelected(TRIZ_PRINCIPLES[selected.id]); setQuizState({answered:null,correct:false}); }} style={{ flex: 1, background: "rgba(255,255,255,0.06)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 12, padding: "12px", color: "#9CA3AF", cursor: "pointer", fontSize: 13 }}>다음 원리 →</button>)}
          </div>

          <button onClick={() => toggleLearned(selected.id)} style={{ width: "100%", padding: "16px", borderRadius: 16, border: "none", background: learned.includes(selected.id) ? "rgba(255,255,255,0.08)" : `linear-gradient(135deg, ${selected.color}, ${selected.color}CC)`, color: learned.includes(selected.id) ? "#9CA3AF" : "#fff", fontSize: 15, fontWeight: 700, cursor: "pointer" }}>
            {learned.includes(selected.id) ? "✓ 학습 완료 (취소하기)" : "📌 학습 완료로 표시"}
          </button>
        </div>
      )}

      {/* QUIZ */}
      {view === "quiz" && randomQuiz && (
        <div style={{ padding: "20px 16px", paddingBottom: 100 }}>
          <div style={{ textAlign: "center", marginBottom: 24 }}>
            <div style={{ fontSize: 13, color: "#6B7280", marginBottom: 4 }}>랜덤 퀴즈</div>
            <div style={{ fontSize: 28, fontWeight: 800 }}>🧩 퀴즈 도전!</div>
            {streak > 0 && (<div style={{ marginTop: 8, fontSize: 13, color: "#FF6B35", fontWeight: 700 }}>🔥 연속 정답 {streak}회!</div>)}
          </div>
          <div style={{ background: `linear-gradient(135deg, ${randomQuiz.color}20, ${randomQuiz.color}08)`, border: `1px solid ${randomQuiz.color}40`, borderRadius: 20, padding: 24, marginBottom: 20, textAlign: "center" }}>
            <div style={{ fontSize: 40, marginBottom: 10 }}>{randomQuiz.icon}</div>
            <div style={{ fontSize: 11, color: randomQuiz.color, letterSpacing: 2, marginBottom: 6 }}>원리 #{randomQuiz.id}</div>
            <div style={{ fontSize: 15, fontWeight: 600, lineHeight: 1.7 }}>{randomQuiz.quiz.question}</div>
          </div>
          {randomQuiz.quiz.options.map((opt, i) => {
            const isAnswered = quizState.answered !== null;
            const isSelected = quizState.answered === i;
            const isCorrect = i === randomQuiz.quiz.answer;
            let bg = "rgba(255,255,255,0.05)", border = "rgba(255,255,255,0.1)";
            if (isAnswered) { if (isCorrect) { bg = "rgba(78,205,196,0.15)"; border = "#4ECDC4"; } else if (isSelected) { bg = "rgba(255,80,80,0.15)"; border = "#FF5050"; } }
            return (<button key={i} onClick={() => !isAnswered && handleQuizAnswer(i)} style={{ display: "block", width: "100%", background: bg, border: `1px solid ${border}`, borderRadius: 14, padding: "14px 18px", marginBottom: 10, cursor: isAnswered ? "default" : "pointer", color: "#E8EAF0", fontSize: 14, textAlign: "left" }}>
              <span style={{ color: "#6B7280", marginRight: 10, fontWeight: 700 }}>{["A","B","C","D"][i]}</span>{opt}
              {isAnswered && isCorrect && <span style={{ float: "right", color: "#4ECDC4" }}>✓</span>}
              {isAnswered && isSelected && !isCorrect && <span style={{ float: "right", color: "#FF6B6B" }}>✗</span>}
            </button>);
          })}
          {quizState.answered !== null && (
            <div style={{ marginTop: 16 }}>
              <div style={{ padding: 16, borderRadius: 14, background: quizState.correct ? "rgba(78,205,196,0.1)" : "rgba(255,80,80,0.1)", border: `1px solid ${quizState.correct ? "#4ECDC450" : "#FF505050"}`, marginBottom: 16, textAlign: "center" }}>
                <div style={{ fontSize: 24, marginBottom: 4 }}>{quizState.correct ? "🎉" : "❌"}</div>
                <div style={{ fontWeight: 700, color: quizState.correct ? "#4ECDC4" : "#FF6B6B" }}>{quizState.correct ? "정답!" : "틀렸습니다!"}</div>
                <div style={{ fontSize: 12, color: "#6B7280", marginTop: 4 }}>관련 원리: <span style={{ color: randomQuiz.color }}>{randomQuiz.name}</span></div>
              </div>
              <div style={{ display: "flex", gap: 10 }}>
                <button onClick={() => { setSelected(randomQuiz); setView("detail"); setQuizState({answered:null,correct:false}); }} style={{ flex: 1, background: "rgba(255,255,255,0.06)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 12, padding: 14, color: "#9CA3AF", cursor: "pointer", fontSize: 13 }}>원리 상세 보기</button>
                <button onClick={startQuiz} style={{ flex: 1, background: "linear-gradient(135deg, #4ECDC4, #45B7D1)", border: "none", borderRadius: 12, padding: 14, color: "#fff", cursor: "pointer", fontSize: 13, fontWeight: 700 }}>다음 퀴즈 →</button>
              </div>
            </div>
          )}
          <div style={{ marginTop: 24, background: "rgba(255,255,255,0.04)", borderRadius: 14, padding: 14, display: "flex", justifyContent: "space-around", textAlign: "center" }}>
            <div><div style={{ fontSize: 18, fontWeight: 800, color: "#4ECDC4" }}>{correctCount}</div><div style={{ fontSize: 11, color: "#6B7280" }}>정답</div></div>
            <div><div style={{ fontSize: 18, fontWeight: 800, color: "#FF6B6B" }}>{totalQuizzes - correctCount}</div><div style={{ fontSize: 11, color: "#6B7280" }}>오답</div></div>
            <div><div style={{ fontSize: 18, fontWeight: 800, color: "#FF6B35" }}>{streak}</div><div style={{ fontSize: 11, color: "#6B7280" }}>연속 정답</div></div>
          </div>
        </div>
      )}

      {/* STATS */}
      {view === "stats" && (
        <div style={{ padding: "20px 16px", paddingBottom: 100 }}>
          <div style={{ background: "rgba(255,255,255,0.04)", borderRadius: 20, padding: 20, marginBottom: 16, textAlign: "center" }}>
            <div style={{ fontSize: 40, marginBottom: 8 }}>📊</div>
            <div style={{ fontSize: 22, fontWeight: 800, marginBottom: 4 }}>학습 현황</div>
            <div style={{ fontSize: 13, color: "#6B7280" }}>{learned.length}/40 원리 학습 완료</div>
            <div style={{ marginTop: 16, background: "rgba(255,255,255,0.08)", borderRadius: 8, height: 12, overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${learned.length / 40 * 100}%`, background: "linear-gradient(90deg, #FF6B35, #FF8C5E)", borderRadius: 8 }} />
            </div>
          </div>
          <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 12 }}>카테고리별 진행도</div>
          {Object.entries(categoryColors).map(([cat, color]) => {
            const total = TRIZ_PRINCIPLES.filter(p => p.category === cat).length;
            const done = TRIZ_PRINCIPLES.filter(p => p.category === cat && learned.includes(p.id)).length;
            return (
              <div key={cat} style={{ background: "rgba(255,255,255,0.04)", borderRadius: 12, padding: 14, marginBottom: 8 }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
                  <span style={{ fontSize: 13, fontWeight: 600, color }}>{cat}</span>
                  <span style={{ fontSize: 12, color: "#6B7280" }}>{done}/{total}</span>
                </div>
                <div style={{ background: "rgba(255,255,255,0.08)", borderRadius: 4, height: 6 }}>
                  <div style={{ height: "100%", width: `${done / total * 100}%`, background: color, borderRadius: 4, transition: "width 0.5s ease" }} />
                </div>
              </div>
            );
          })}
          <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 12, marginTop: 16 }}>퀴즈 통계</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            {[
              { label: "총 퀴즈", value: totalQuizzes, color: "#45B7D1" },
              { label: "정답 수", value: correctCount, color: "#4ECDC4" },
              { label: "오답 수", value: totalQuizzes - correctCount, color: "#FF6B6B" },
              { label: "정답률", value: `${totalQuizzes > 0 ? Math.round(correctCount/totalQuizzes*100) : 0}%`, color: "#FF6B35" },
            ].map((s, i) => (
              <div key={i} style={{ background: `${s.color}12`, border: `1px solid ${s.color}30`, borderRadius: 14, padding: 16, textAlign: "center" }}>
                <div style={{ fontSize: 24, fontWeight: 800, color: s.color }}>{s.value}</div>
                <div style={{ fontSize: 11, color: "#6B7280", marginTop: 4 }}>{s.label}</div>
              </div>
            ))}
          </div>
          {learned.length > 0 && (
            <>
              <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 12, marginTop: 20 }}>학습 완료 원리</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                {TRIZ_PRINCIPLES.filter(p => learned.includes(p.id)).map(p => (
                  <button key={p.id} onClick={() => { setSelected(p); setView("detail"); setQuizState({answered:null,correct:false}); }} style={{ background: `${p.color}20`, border: `1px solid ${p.color}40`, borderRadius: 20, padding: "6px 12px", cursor: "pointer", color: p.color, fontSize: 12, fontWeight: 600 }}>
                    #{p.id} {p.name}
                  </button>
                ))}
              </div>
            </>
          )}
        </div>
      )}

      {/* Bottom Nav */}
      {view !== "detail" && (
        <div style={{ position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 430, background: "rgba(10,14,26,0.95)", borderTop: "1px solid rgba(255,255,255,0.08)", display: "flex", backdropFilter: "blur(20px)", zIndex: 200 }}>
          {[
            { icon: "🏠", label: "홈", id: "home" },
            { icon: "📚", label: "원리", id: "list" },
            { icon: "🧩", label: "퀴즈", id: "quiz", action: startQuiz },
            { icon: "📊", label: "현황", id: "stats" },
          ].map(item => (
            <button key={item.id} onClick={item.action || (() => setView(item.id))} style={{ flex: 1, background: "none", border: "none", padding: "14px 8px 18px", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 4, opacity: view === item.id || (item.id === "quiz" && view === "quiz") ? 1 : 0.4 }}>
              <span style={{ fontSize: 20 }}>{item.icon}</span>
              <span style={{ fontSize: 10, color: "#E8EAF0" }}>{item.label}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<TrizApp />);
  </script>
</body>
</html>
